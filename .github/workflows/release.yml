name: Auto release

# Every human push to main publishes a new MINOR release (skill / tooling work):
#   1.26.0 -> 1.27.0 -> 1.28.0 ...
# Daily knowledge-base refreshes are PATCH releases, cut by kb-sync.yml instead.
# The version source of truth is plugin.json (not tag parsing), so the two
# workflows never fight over the number.
on:
  push:
    branches: [main]

# Let the workflow create tags and releases.
permissions:
  contents: write

# Shared with kb-sync so a release and a scrape never touch main at once.
concurrency:
  group: main-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (full history + tags)
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Compute next minor version
        id: ver
        run: |
          current=$(jq -r '.version' .claude-plugin/plugin.json)
          IFS='.' read -r major minor patch <<< "$current"
          minor=$(( minor + 1 )); patch=0
          semver="${major}.${minor}.${patch}"
          # Guard against an existing tag (e.g. re-run): keep bumping minor.
          while git rev-parse "v${semver}" >/dev/null 2>&1; do
            minor=$(( minor + 1 )); semver="${major}.${minor}.0"
          done
          echo "prev=$current"  >> "$GITHUB_OUTPUT"
          echo "semver=$semver" >> "$GITHUB_OUTPUT"
          echo "next=v$semver"  >> "$GITHUB_OUTPUT"
          echo "Next version: v$semver (from $current)"

      - name: Bump plugin version on main
        env:
          SEMVER: ${{ steps.ver.outputs.semver }}
        run: |
          tmp=$(mktemp)
          jq --arg v "$SEMVER" '.version = $v' .claude-plugin/plugin.json > "$tmp" && mv "$tmp" .claude-plugin/plugin.json
          jq --arg v "$SEMVER" '.plugins[0].version = $v' .claude-plugin/marketplace.json > "$tmp" && mv "$tmp" .claude-plugin/marketplace.json
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .claude-plugin/plugin.json .claude-plugin/marketplace.json
          # [skip ci] stops this commit from triggering another release run.
          git commit -m "chore: release ${SEMVER} [skip ci]" || echo "version unchanged"
          git push origin HEAD:main

      - name: Build skill zips
        run: ./scripts/build-zips.sh

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.ver.outputs.next }}" dist/*.zip \
            --title "${{ steps.ver.outputs.next }}" \
            --target main \
            --latest \
            --generate-notes

      - name: Notify Slack (#product-hotline)
        if: success()
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          prev="v${{ steps.ver.outputs.prev }}"
          next="${{ steps.ver.outputs.next }}"
          # Short changelog = commit subjects since the previous release tag.
          range="${prev}..HEAD"
          git rev-parse "$prev" >/dev/null 2>&1 || range="HEAD~10..HEAD"
          changelog=$(git log "$range" --no-merges --pretty=format:'• %s' \
                       | grep -viE 'co-authored-by|\[skip ci\]|chore: release|chore\(kb\)' | head -8)
          [ -z "$changelog" ] && changelog="• See release notes"
          text=$(printf ':rocket: *BrioHR PM Skills %s released* by %s\n%s\n\n:sparkles: Auto-syncing to everyone’s Claude via the plugin — no download or upload needed.' \
                  "$next" "${{ github.actor }}" "$changelog")
          payload=$(jq -n --arg t "$text" '{text:$t}')
          curl -sS -X POST -H 'Content-type: application/json' --data "$payload" "$SLACK_WEBHOOK_URL"
