name: Auto release

# Every push to main rebuilds the skill zips and publishes a new release,
# bumping the minor version: v1.0 -> v1.1 -> v1.2 -> ...
on:
  push:
    branches: [main]

# Let the workflow create tags and releases.
permissions:
  contents: write

# Never run two releases at once (avoids version races on rapid pushes).
concurrency:
  group: auto-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (full history + tags)
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Compute next version
        id: ver
        run: |
          # Only consider two-part tags from this scheme: vMAJOR.MINOR
          latest=$(git tag -l 'v*' | grep -E '^v[0-9]+\.[0-9]+$' | sort -V | tail -1)
          if [ -z "$latest" ]; then
            next="v1.0"
          else
            num=${latest#v}
            major=${num%.*}
            minor=${num#*.}
            next="v${major}.$((minor + 1))"
          fi
          echo "prev=$latest" >> "$GITHUB_OUTPUT"
          echo "next=$next" >> "$GITHUB_OUTPUT"
          echo "Next version: $next (prev: ${latest:-none})"

      - name: Build skill zips
        run: ./scripts/build-zips.sh

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.ver.outputs.next }}" dist/*.zip \
            --title "${{ steps.ver.outputs.next }}" \
            --latest \
            --generate-notes

      - name: Notify Slack (#product-hotline)
        if: success()
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          prev="${{ steps.ver.outputs.prev }}"
          next="${{ steps.ver.outputs.next }}"
          # Short changelog = commit subjects since the previous release.
          if [ -n "$prev" ]; then range="${prev}..HEAD"; else range="HEAD~10..HEAD"; fi
          changelog=$(git log "$range" --no-merges --pretty=format:'• %s' \
                       | grep -viE 'co-authored-by' | head -8)
          [ -z "$changelog" ] && changelog="• See release notes"
          repo_url="https://github.com/${{ github.repository }}"
          dl="$repo_url/releases/latest/download"
          text=$(printf ':rocket: *BrioHR PM Skills %s released* by %s\n%s\n\n:inbox_tray: *Install/update* — download each .zip, then in Claude go to *Settings → Capabilities → Skills* and upload it (no need to extract):\n• <%s/feature-brainstorming.zip|feature-brainstorming.zip>\n• <%s/ticket-writing.zip|ticket-writing.zip>\n• <%s/generate-jira-test-cases.zip|generate-jira-test-cases.zip>' \
                  "$next" "${{ github.actor }}" "$changelog" "$dl" "$dl" "$dl")
          payload=$(jq -n --arg t "$text" '{text:$t}')
          curl -sS -X POST -H 'Content-type: application/json' --data "$payload" "$SLACK_WEBHOOK_URL"
